name: Installed package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            fast: false
          - python: '3.13'
            fast: false
          - python: '3.13'
            fast: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build source distribution, then wheel from that distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and test dependencies
        env:
          FAST: ${{ matrix.fast }}
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print)
          test -n "$wheel"
          python -m pip install "$wheel[test]"
          if [ "$FAST" = true ]; then
            python -m pip install "$wheel[fast]"
          fi
          python -m pip check
      - name: Check installed provenance, version and optional backend
        env:
          FAST: ${{ matrix.fast }}
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import segrobust
          from segrobust.corruptions import _shuffle_pixels_glass_blur
          assert not Path(segrobust.__file__).resolve().is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve())
          assert segrobust.__version__ == version('segrobust')
          assert hasattr(_shuffle_pixels_glass_blur, 'py_func') == (os.environ['FAST'] == 'true')
          print(segrobust.__file__, segrobust.__version__)
          PY
          segrobust list > installed-corruptions.txt
          grep -q gaussian_noise installed-corruptions.txt
          grep -q elastic_transform installed-corruptions.txt
      - name: Run the full suite outside the checkout
        run: |
          cp -R tests "$RUNNER_TEMP/segrobust-tests"
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib -q segrobust-tests
